apiVersion: v1
kind: ConfigMap
metadata:
  name: shipping
  namespace: roboshop
data:
  CART_ENDPOINT: "cart:8080"
  DB_HOST: "mysql"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  namespace: roboshop
  labels:
    project: roboshop
    component: shipping
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: shipping
      tier: backend
  template:
    metadata:
      labels:
        project: roboshop
        component: shipping
        tier: backend
    spec:
      containers:
      - name: shipping
        image: hareeshreddygundlapalli/shipping:v1
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: shipping
        ports:
        - name: liveness-port
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: liveness-port
          initialDelaySeconds: 40  # Increased from 30 to be safe
          periodSeconds: 20        # Check less frequently
          timeoutSeconds: 5        # Give the app 5s to respond (CRITICAL)
          failureThreshold: 5      # Allow more retries before failing
        livenessProbe:
          httpGet:
            path: /health
            port: liveness-port
          initialDelaySeconds: 60  # Give it a full minute to boot
          periodSeconds: 20        # Check every 20s instead of 15s
          timeoutSeconds: 5        # Give the app 5s to respond
          failureThreshold: 3      # Allow 3 failures before killing it
---
apiVersion: v1
kind: Service
metadata:
  name: shipping
  namespace: roboshop
spec:
  selector:
    project: roboshop
    component: shipping
    tier: backend
  ports:
    - protocol: TCP
      port: 8080 
      targetPort: 8080